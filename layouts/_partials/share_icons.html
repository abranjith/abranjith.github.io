{{- /* Override PaperMod's share buttons: show the same profile links as the home page (params.socialIcons). */ -}}
<div class="share-buttons social-icons">
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
</div>
