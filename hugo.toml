baseURL = 'https://abranjith.github.io'
locale = 'en-us'
title = 'ranjith'
theme = ["PaperMod"]
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = [ "posts" ]

[caches.images]
dir = ":cacheDir/images"

[minify]
disableXML = true

[pagination]
disableAliases = false
pagerSize = 5

[languages.en]
label = "English"
weight = 1

[languages.en.taxonomies]
category = "categories"
tag = "tags"
series = "series"

[[languages.en.menu.main]]
name = "Archive"
url = "archives"
weight = 5

[[languages.en.menu.main]]
name = "Search"
url = "search/"
weight = 10

[[languages.en.menu.main]]
name = "Tags"
url = "tags/"
weight = 10

[outputs]
home = [ "HTML", "RSS", "JSON" ]

[params]
env = "production"
description = "Ranjith's blog: notes on software engineering and AI"
author = "Ranjith Bojraj"
defaultTheme = "auto"
ShowShareButtons = true
ShowReadingTime = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true

[params.profileMode]
enabled = false
title = "ranjith"
imageUrl = "#"
imageTitle = "my image"

[[params.profileMode.buttons]]
name = "Archives"
url = "archives"

[[params.profileMode.buttons]]
name = "Tags"
url = "tags"

[params.homeInfoParams]
Title = "Hello"
Content = """
Hello! Welcome! I write about software engineering, AI, and everything in between.
"""

[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/abranjith"

[[params.socialIcons]]
name = "X"
title = "X/Twitter"
url = "https://x.com/abranjith"

[[params.socialIcons]]
name = "linkedin"
title = "LinkedIn"
url = "https://www.linkedin.com/in/ranjith-bojraj-22031753/"

[params.assets]
disableHLJS = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true